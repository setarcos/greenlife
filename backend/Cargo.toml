[package]
name = "Greenlife"
version = "0.2.0"
edition = "2021"
authors = ["Pluto Yang"]
license = "BSD-3-Clause"

[dependencies]
actix-web = "4"
# 登录限流用 governor 本体（MIT）+ 自己的中间件；actix-governor 是 GPL-3.0-or-later，
# 链接后整个项目就没法用宽松协议发布了，见 src/rate_limit.rs。
governor = "0.10"

diesel = { version = "2.2.0", features = ["postgres", "r2d2", "uuid", "chrono"] }

dotenvy = "0.15" # For .env file
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "8"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.10"
futures-util = "0.3" # For middleware
derive_more = "2"
bitflags = { version = "2.4", features = ["serde"] }
actix-multipart = "0.8.5"
actix-files = "0.7.0"
quick-xml = "0.41" # 解析鸟调 GPX 里的 waypoint

# 注意：actix-service / actix-rt 不再作为直接依赖。
# actix-web 已经 re-export 了 actix_web::dev::{Service, Transform, forward_ready}
# 和 #[actix_web::main]，直接依赖它们只会有版本漂移的风险。
